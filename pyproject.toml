[project]
name = "snake-arena-rsi"
version = "0.1.0"
description = "A five-snake battle arena used as a lab for recursive self-improvement of agent policies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
llm = ["anthropic"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["arena"]
